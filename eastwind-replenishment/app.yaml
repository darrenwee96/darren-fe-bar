command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: DATABRICKS_GENIE_SPACE_ID
    valueFrom: genie-space
  # Network-wide analysts: comma-separated workspace emails, each seeded at startup as a '*' row in
  # replenishment.user_scope (idempotent). To add an evaluator, append their email here and redeploy:
  #   value: '<email1>,<email2>'
  # Removing an email does not revoke access; delete their user_scope row (see README). Everyone not listed and
  # without a user_scope row is fail-closed: no order lines, 403 on decisions.
  - name: REPLENISHMENT_ANALYSTS
    value: 'darren.wee@databricks.com'
